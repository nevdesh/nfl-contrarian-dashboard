name: VSiN NCAA Capture

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: vsin-authenticated-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Capture VSiN NCAA page
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
          DATA_URL: https://data.vsin.com/betting-splits/?source=DK&sport=CFB
          LOGIN_URL_MARKERS: login,signin,sign-in
        run: python ncaa_vsin_capture.py

      - name: Upload NCAA capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsin-ncaa-capture-${{ github.run_number }}
          path: ncaa_captures/
          if-no-files-found: ignore
          retention-days: 7
