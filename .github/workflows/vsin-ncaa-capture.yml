name: VSiN NCAA Capture

permissions:
  contents: write

on:
  push:
    branches:
      - ncaa-football
    paths:
      - ncaa_vsin_capture.py
      - .github/workflows/vsin-ncaa-capture.yml
  workflow_dispatch:

concurrency:
  group: vsin-authenticated-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Capture VSiN NCAA page
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
          DATA_URL: https://data.vsin.com/betting-splits/?source=DK&sport=CFB
          LOGIN_URL_MARKERS: login,signin,sign-in
        run: python ncaa_vsin_capture.py

      - name: Generate NCAA betting splits
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find ncaa_captures -type f -name '*-tables.json' | sort | tail -n 1)
          if [ -z "$TABLE_FILE" ]; then
            echo "ERROR: No NCAA tables JSON found."
            exit 1
          fi
          mkdir -p data
          python ncaa_vsin_parser.py "$TABLE_FILE" --output data/ncaa_betting_splits.csv
      - name: Record NCAA odds history
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find ncaa_captures -type f -name '*-tables.json' | sort | tail -n 1)
          if [ -z "$TABLE_FILE" ]; then
            echo "ERROR: No NCAA tables JSON found."
            exit 1
          fi
          mkdir -p data
          python ncaa_odds_history.py "$TABLE_FILE" --output data/ncaa_odds_history.csv
      - name: Publish NCAA CSV files
        shell: bash
        run: |
          set -euo pipefail

          test -f data/ncaa_betting_splits.csv
          test -f data/ncaa_odds_history.csv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ncaa_betting_splits.csv data/ncaa_odds_history.csv

          if git diff --cached --quiet; then
            echo "No NCAA data changes to publish."
          else
            git commit -m "Update automated NCAA football data"
            git push origin HEAD:ncaa-football
          fi
      - name: Upload NCAA capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsin-ncaa-capture-${{ github.run_number }}
          path: ncaa_captures/
          if-no-files-found: ignore
          retention-days: 7




