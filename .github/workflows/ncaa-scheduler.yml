name: NCAA Football Scheduled Capture

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vsin-ncaa-authenticated-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout NCAA branch
        uses: actions/checkout@v4
        with:
          ref: ncaa-football

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Capture NCAA betting splits
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
          DATA_URL: https://data.vsin.com/betting-splits/?source=DK&sport=CFB
          LOGIN_URL_MARKERS: login,signin,sign-in
        run: python ncaa_vsin_capture.py

      - name: Generate NCAA betting splits
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find ncaa_captures -type f -name '*-tables.json' | sort | tail -n 1)
          test -n "$TABLE_FILE"
          mkdir -p data
          python ncaa_vsin_parser.py "$TABLE_FILE" --output data/ncaa_betting_splits.csv

      - name: Record NCAA odds history
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find ncaa_captures -type f -name '*-tables.json' | sort | tail -n 1)
          test -n "$TABLE_FILE"
          mkdir -p data
          python ncaa_odds_history.py "$TABLE_FILE" --output data/ncaa_odds_history.csv

      - name: Publish NCAA data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaa_betting_splits.csv data/ncaa_odds_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update automated NCAA football data"
            git push origin HEAD:ncaa-football
          fi

      - name: Upload NCAA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-scheduled-capture-${{ github.run_number }}
          path: ncaa_captures/
          if-no-files-found: ignore
          retention-days: 7