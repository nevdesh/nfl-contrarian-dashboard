name: VSiN NBA Capture

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: vsin-nba-authenticated-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Capture VSiN NBA page
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
          DATA_URL: https://data.vsin.com/betting-splits/?source=DK&sport=NBA
          LOGIN_URL_MARKERS: login,signin,sign-in
        run: python nba_vsin_capture.py

      - name: Generate NBA betting splits
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find nba_captures -type f -name '*-tables.json' | sort | tail -n 1)
          if [ -z "$TABLE_FILE" ]; then
            echo "ERROR: No NBA tables JSON found."
            exit 1
          fi
          mkdir -p data
          python nba_vsin_parser.py "$TABLE_FILE" --output data/nba_betting_splits.csv
      - name: Record NBA odds history
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find nba_captures -type f -name '*-tables.json' | sort | tail -n 1)
          if [ -z "$TABLE_FILE" ]; then
            echo "ERROR: No NBA tables JSON found."
            exit 1
          fi
          mkdir -p data
          python nba_odds_history.py "$TABLE_FILE" --output data/nba_odds_history.csv
      - name: Publish NBA CSV files
        shell: bash
        run: |
          set -euo pipefail

          test -f data/nba_betting_splits.csv
          test -f data/nba_odds_history.csv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nba_betting_splits.csv data/nba_odds_history.csv

          if git diff --cached --quiet; then
            echo "No NBA data changes to publish."
          else
            git commit -m "Update automated NBA football data"
            git push origin HEAD:nba-basketball
          fi
      - name: Upload NBA capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsin-nba-capture-${{ github.run_number }}
          path: nba_captures/
          if-no-files-found: ignore
          retention-days: 7




