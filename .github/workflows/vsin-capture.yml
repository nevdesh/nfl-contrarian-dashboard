name: VSiN authenticated NFL capture

permissions:
  contents: write

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: vsin-authenticated-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium
      - name: Capture VSiN NFL page
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
          DATA_URL: https://data.vsin.com/betting-splits/?source=DK&sport=NFL
          LOGIN_URL_MARKERS: login,signin,sign-in
        run: python vsin_capture.py
      - name: Generate NFL contrarian qualifiers
        shell: bash
        run: |
          TABLE_FILE=$(find captures -type f -name '*-tables.json' | sort | tail -n 1)
          if [ -z "$TABLE_FILE" ]; then
            echo "ERROR: No VSiN tables JSON found."
            exit 1
          fi
          python vsin_parser.py "$TABLE_FILE" --output captures/contrarian_qualifiers.csv
      - name: Record NFL odds history
        shell: bash
        run: |
          set -euo pipefail
          TABLE_FILE=$(find captures -type f -name '*-tables.json' | sort | tail -n 1)
          if [ -z "$TABLE_FILE" ]; then
            echo "ERROR: No VSiN tables JSON found."
            exit 1
          fi
          python odds_history.py "$TABLE_FILE" --output data/odds_history.csv
      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsin-capture-${{ github.run_number }}
          path: captures/
          if-no-files-found: ignore
          retention-days: 7
          
      - name: Publish contrarian CSV to repository
        shell: bash
        run: |
          set -euo pipefail

          test -f captures/contrarian_qualifiers.csv

          mkdir -p data
          cp captures/contrarian_qualifiers.csv data/contrarian_qualifiers.csv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contrarian_qualifiers.csv data/odds_history.csv

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update automated NFL contrarian results"
            git push origin HEAD:main
          fi

